<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Azeret+Mono:wght@400..600&display=swap"><style>
[data-om-starter] *{scrollbar-width:none}
[data-om-starter] *::-webkit-scrollbar{display:none}
</style></helmet>

<x-import component-from-global-scope="IOSDevice" hint-size="402px,874px">
<div style="height:100%;display:flex;flex-direction:column;background:#FAF8F4;color:#141A17;font-family:Archivo,sans-serif">

  <div style="flex:none;padding:66px 20px 0;display:flex;align-items:center;gap:10px">
    <button onClick="{{ voltar }}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border:none;background:none;cursor:pointer;flex:none">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 1.5 2 10l8 8.5" stroke="#141A17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <span style="flex:1;min-width:0;font:700 20px/1.15 Archivo,sans-serif;color:#3C443E">{{ titulo }}</span>
  </div>

  <div style="flex:none;padding:12px 20px 12px;display:flex;gap:8px">
    <sc-if value="{{ abaTermos }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ verTermos }}" style="flex:none;height:40px;padding:0 14px;border:none;border-radius:999px;background:#E4E9E5;cursor:pointer;font:700 13px/1 Archivo,sans-serif;color:#1B6B3A">Termos de uso</button>
      <button onClick="{{ verPrivacidade }}" style="flex:none;height:40px;padding:0 14px;border:none;border-radius:999px;background:#F0EDE6;cursor:pointer;font:600 13px/1 Archivo,sans-serif;color:#3C443E" style-active="background:#E4E0D6">Privacidade</button>
    </sc-if>
    <sc-if value="{{ abaPrivacidade }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ verTermos }}" style="flex:none;height:40px;padding:0 14px;border:none;border-radius:999px;background:#F0EDE6;cursor:pointer;font:600 13px/1 Archivo,sans-serif;color:#3C443E" style-active="background:#E4E0D6">Termos de uso</button>
      <button onClick="{{ verPrivacidade }}" style="flex:none;height:40px;padding:0 14px;border:none;border-radius:999px;background:#E4E9E5;cursor:pointer;font:700 13px/1 Archivo,sans-serif;color:#1B6B3A">Privacidade</button>
    </sc-if>
  </div>

  <div style="flex:1;min-height:0;overflow:auto;padding:4px 20px 138px;display:flex;flex-direction:column;gap:4px">
    <span style="padding:0 2px 14px;font:500 12px/1.5 Archivo,sans-serif;color:#6E7770">{{ vigencia }}</span>
    <sc-for list="{{ blocos }}" as="b" hint-placeholder-count="7">
      <div style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:18px;background:#F0EDE6">
        <span style="font:700 11px/1 Archivo,sans-serif;letter-spacing:.16em;color:#6E7770">{{ b.titulo }}</span>
        <span style="font:500 14.5px/1.55 Archivo,sans-serif;color:#3C443E;text-wrap:pretty">{{ b.texto }}</span>
      </div>
    </sc-for>

    <div style="display:flex;flex-direction:column;gap:8px;margin-top:18px;padding:16px 18px;border-radius:18px;background:#E4E9E5">
      <span style="font:700 11px/1 Archivo,sans-serif;letter-spacing:.16em;color:#1B6B3A">DÚVIDA SOBRE ISSO</span>
      <span style="font:500 14.5px/1.55 Archivo,sans-serif;color:#22402F;text-wrap:pretty">Fala com a gente no WhatsApp (88) 99612-0000 ou em ola@fretigate.com.br. A gente responde em português, sem juridiquês.</span>
    </div>

    <sc-if value="{{ ehCadastro }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ aceitar }}" style="flex:none;height:60px;margin-top:22px;border:none;border-radius:999px;background:#1B6B3A;cursor:pointer;font:700 17px/1 Archivo,sans-serif;color:#fff" style-active="background:#14522C">Li e aceito</button>
    </sc-if>
  </div>


  <sc-if value="{{ temBarra }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:max(16px, calc(env(safe-area-inset-left) + 16px));right:max(16px, calc(env(safe-area-inset-right) + 16px));bottom:max(26px, calc(env(safe-area-inset-bottom) + 20px));z-index:40;display:flex;align-items:flex-end;height:57px;padding:0 4px;border-radius:999px;background:#141A17">
      <button onClick="{{ navInicio }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:57px;padding-bottom:11px;border:none;background:none;cursor:pointer">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M2.6 8.4 10 2.4l7.4 6v8.2a1 1 0 0 1-1 1h-3.6v-5.2H7.2v5.2H3.6a1 1 0 0 1-1-1V8.4Z" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span style="font:600 10.5px/1 Archivo,sans-serif;color:rgba(255,255,255,.5)">Início</span>
      </button>
      <button onClick="{{ navFretes }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:57px;padding-bottom:11px;border:none;background:none;cursor:pointer">
        <svg width="21" height="19" viewBox="0 0 22 20" fill="none"><path d="M1.6 4.2h11.2v9.4H1.6zM12.8 7.4h4l3.6 3.4v2.8h-7.6z" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="5.8" cy="15.8" r="2" stroke="rgba(255,255,255,.5)" stroke-width="1.8"></circle><circle cx="16.2" cy="15.8" r="2" stroke="rgba(255,255,255,.5)" stroke-width="1.8"></circle></svg>
        <span style="font:600 10.5px/1 Archivo,sans-serif;color:rgba(255,255,255,.5)">Fretes</span>
      </button>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:57px;padding-bottom:11px">
        <button onClick="{{ navNovo }}" style="flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin-top:-18px;border:none;border-radius:999px;background:#1B6B3A;cursor:pointer">
          <svg width="24" height="24" viewBox="0 0 26 26" fill="none"><path d="M13 4.5v17M4.5 13h17" stroke="#fff" stroke-width="2.8" stroke-linecap="round"></path></svg>
        </button>
        <span style="font:700 10.5px/1 Archivo,sans-serif;color:#fff">Novo</span>
      </div>
      <button onClick="{{ navCobrancas }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:57px;padding-bottom:11px;border:none;background:none;cursor:pointer">
        <svg width="20" height="19" viewBox="0 0 20 20" fill="none"><path d="M2.4 3.6h15.2v10.2a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1V3.6Z" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linejoin="round"></path><path d="M5.6 7h8.8M5.6 10.4h5" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linecap="round"></path></svg>
        <span style="font:600 10.5px/1 Archivo,sans-serif;color:rgba(255,255,255,.5)">Cobranças</span>
      </button>
      <button onClick="{{ navMais }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:57px;padding-bottom:11px;border:none;background:none;cursor:pointer">
        <svg width="20" height="19" viewBox="0 0 20 20" fill="none"><path d="M3.4 6h13.2M3.4 10h13.2M3.4 14h8.4" stroke="#7FCB9B" stroke-width="1.8" stroke-linecap="round"></path></svg>
        <span style="font:700 10.5px/1 Archivo,sans-serif;color:#7FCB9B">Mais</span>
      </button>
    </div>
  </sc-if>

</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;abaInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;termos&quot;,&quot;privacidade&quot;],&quot;default&quot;:&quot;termos&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estado&quot;},&quot;origem&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ajustes&quot;,&quot;cadastro&quot;],&quot;default&quot;:&quot;ajustes&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estado&quot;},&quot;onAceitar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onVoltar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onInicio&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onFretes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onNovo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onCobrancas&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onMais&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const TERMOS = [
  { titulo: 'O QUE É O FRETIGATE', texto: 'Um sistema para você registrar seus fretes, cobrar seus clientes e saber quanto entrou e quanto falta. Quem opera é você: o FretiGate guarda e organiza, não fecha negócio nem cobra ninguém no seu lugar.' },
  { titulo: 'DE QUEM SÃO OS DADOS', texto: 'Os fretes, clientes, valores e relatórios são seus. Você pode exportar tudo quando quiser e pode apagar a conta a qualquer momento. Não vendemos seus dados nem mostramos para outra transportadora.' },
  { titulo: 'QUEM PODE ENTRAR', texto: 'Você e as pessoas que você convidar. Todo mundo com acesso vê os mesmos fretes e cobranças. Só o dono da conta remove acesso, e você é responsável por quem convida.' },
  { titulo: 'MENSAGENS NO WHATSAPP', texto: 'O FretiGate nunca envia mensagem sozinho. Ele abre a conversa com o texto pronto e quem aperta enviar é você. O que acontece depois na conversa é entre você e o seu cliente.' },
  { titulo: 'RELATÓRIO E COBRANÇA', texto: 'O relatório que sai daqui é um documento da sua transportadora, com os seus dados e a sua chave Pix. O FretiGate não recebe dinheiro por você, não intermedeia o pagamento e não é responsável pela cobrança em si.' },
  { titulo: 'ASSINATURA', texto: 'A cobrança é mensal ou anual, renovada automaticamente. Cancelou, você fica até o fim do período já pago e continua podendo exportar seus dados por 90 dias depois disso.' },
  { titulo: 'QUANDO A GENTE FALHA', texto: 'Se o sistema sair do ar ou perder informação por culpa nossa, devolvemos a mensalidade proporcional. Não respondemos por prejuízo de negócio — quem decide o preço do frete e quem cobra é você.' },
  { titulo: 'MUDANÇA NESTES TERMOS', texto: 'Se algo importante mudar, avisamos dentro do app, na sua tela inicial, com pelo menos 30 dias de antecedência. Continuar usando depois disso vale como aceite.' },
];
const PRIVACIDADE = [
  { titulo: 'O QUE A GENTE GUARDA', texto: 'O que você digita: fretes, clientes, caminhões, motoristas, valores e as fotos de comprovante que você anexa. Mais o seu número de telefone, que é como você entra.' },
  { titulo: 'O QUE A GENTE NÃO PEGA', texto: 'Não lemos sua conversa do WhatsApp, não acessamos sua agenda e não rastreamos a localização do seu caminhão. Quando você cola uma mensagem para importar frete, só usamos o texto que você colou.' },
  { titulo: 'PARA QUE SERVE', texto: 'Para o sistema funcionar e para melhorar o produto. Olhamos números somados — quantos fretes são lançados por semana, por exemplo — nunca o seu frete específico com nome de cliente.' },
  { titulo: 'COM QUEM COMPARTILHAMOS', texto: 'Com ninguém, fora as empresas que hospedam e processam pagamento, e só o necessário para isso. Não vendemos dado, não fazemos publicidade com seu cadastro e não repassamos para banco ou seguradora.' },
  { titulo: 'ONDE FICA', texto: 'Em servidores no Brasil, com backup diário. Cópia local no seu celular para você conseguir lançar frete sem sinal, que sobe sozinha quando a internet volta.' },
  { titulo: 'SEUS DIREITOS (LGPD)', texto: 'Você pode pedir cópia de tudo, corrigir o que estiver errado, ou apagar a conta. É pelo próprio app, em Ajustes, ou pelo WhatsApp. Apagou, sai tudo em até 30 dias — sem cópia escondida.' },
  { titulo: 'QUANTO TEMPO GUARDAMOS', texto: 'Enquanto sua conta existir. Depois de apagada, mantemos só o que a lei obriga em nota fiscal e pagamento, pelo prazo que ela exige, e nada além disso.' },
];

class Component extends DCLogic {
  state = { aba: null };

  componentDidMount() {
    this.setState({ aba: this.props.abaInicial || 'termos' });
  }

  renderVals() {
    const aba = this.state.aba || 'termos';
    const ehTermos = aba === 'termos';
    const origem = this.props.origem || 'ajustes';
    return {
      titulo: ehTermos ? 'Termos de uso' : 'Política de privacidade',
      abaTermos: ehTermos,
      abaPrivacidade: !ehTermos,
      verTermos: () => this.setState({ aba: 'termos' }),
      verPrivacidade: () => this.setState({ aba: 'privacidade' }),
      vigencia: ehTermos
        ? 'Em vigor desde 1º de agosto de 2026. Escrito para ser lido — se alguma parte não fizer sentido, é falha nossa.'
        : 'Em vigor desde 1º de agosto de 2026. Vale para tudo que você guarda no FretiGate.',
      blocos: ehTermos ? TERMOS : PRIVACIDADE,
      ehCadastro: origem === 'cadastro',
      // vindo do cadastro não há barra: quem lê ainda não está dentro do app
      temBarra: origem !== 'cadastro',
      navInicio: this.props.onInicio || (() => { }),
      navFretes: this.props.onFretes || (() => { }),
      navNovo: this.props.onNovo || (() => { }),
      navCobrancas: this.props.onCobrancas || (() => { }),
      navMais: this.props.onMais || (() => { }),
      aceitar: () => { if (this.props.onAceitar) this.props.onAceitar(); },
      voltar: () => { if (this.props.onVoltar) this.props.onVoltar(); },
    };
  }
}
</script>
</body>
</html>
