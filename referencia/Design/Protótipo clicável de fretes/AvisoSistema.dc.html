<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap"><style>
@keyframes fg-aviso{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
</style></helmet>

<div style="padding:16px 18px;border-radius:22px;background:#141A17;box-shadow:0 14px 34px rgba(20,26,23,.3),0 3px 10px rgba(20,26,23,.16);animation:fg-aviso .24s cubic-bezier(.2,.8,.2,1)">
  <div style="font:600 14.5px/1.4 Archivo,sans-serif;color:#fff;text-wrap:pretty">{{ texto }}</div>
  <sc-if value="{{ temBotoes }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:10px;margin-top:14px">
      <button onClick="{{ onA }}" style="flex:1;height:46px;border:none;border-radius:999px;background:rgba(255,255,255,.1);cursor:pointer;color:#fff;font:600 14px/1 Archivo,sans-serif" style-active="background:rgba(255,255,255,.2)">{{ labelA }}</button>
      <button onClick="{{ onB }}" style="flex:1;height:46px;border:none;border-radius:999px;background:rgba(255,255,255,.1);cursor:pointer;color:#fff;font:600 14px/1 Archivo,sans-serif" style-active="background:rgba(255,255,255,.2)">{{ labelB }}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:370,&quot;height&quot;:140},&quot;texto&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Frete salvo como A faturar.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;temBotoes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;labelA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ainda não&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labelB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Enviei&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onA&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onB&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
