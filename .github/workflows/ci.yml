name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GRUPO FIXO, não por branch/ref — de propósito. Todas as execuções desta
# esteira, de qualquer branch, falam com o MESMO projeto de teste do
# Supabase (CLAUDE.md §5); duas rodando ao mesmo tempo brigam pelo mesmo
# schema. Medido, não suposto (18/08/2026, CLAUDE.md §2 "suíte verde"):
# duas execuções contra commits em sequência rápida se sobrepuseram, uma
# derrubou o schema (`prisma migrate reset --force`) no meio da outra, e o
# resultado foi vermelho sem relação nenhuma com o código — "relation does
# not exist", "permission denied for schema public". `cancel-in-progress`
# faz a execução nova cancelar a anterior em vez de rodar junto.
#
# LIMITAÇÃO CONHECIDA, ACEITA: hoje é só o fundador e este agente
# trabalhando, uma coisa de cada vez — o grupo fixo nunca cancela trabalho
# de verdade. Se um dia mais gente empurrar código ao mesmo tempo, PRs
# paralelos disputariam o mesmo projeto de teste e se cancelariam um ao
# outro — nesse ponto o projeto provavelmente já teria mais de um projeto
# de teste, um por execução, e este grupo mudaria de desenho junto.
concurrency:
  group: esteira-banco-de-teste-unico
  cancel-in-progress: true

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 (o padrao e 1, so o commit mais recente) — a varredura
      # de segredo abaixo precisa enxergar o historico inteiro, nao so o
      # ultimo commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Varredura de segredo (tarefa 4 da auditoria, CLAUDE.md §4). Roda
      # ANTES de instalar qualquer dependencia: nao precisa de node_modules,
      # e segredo commitado torna o resto da esteira sem sentido.
      #
      # Binario baixado direto do GitHub Releases, versao FIXA (nao
      # "latest" — mesmo motivo de node-version: 24 ser fixo), com o
      # checksum conferido contra o arquivo publicado pelo proprio projeto
      # antes de extrair ou executar qualquer coisa.
      #
      # `-f` nos dois `curl`: sem essa flag, um erro HTTP (404, rate limit)
      # grava o corpo do erro no arquivo e o curl sai com sucesso mesmo
      # assim — falha de download viraria varredura "aprovada" sem ter
      # rodado, a mesma classe de defeito que o CLAUDE.md §3 registra sobre
      # teste que não distingue "passou" de "não rodou". `set -euo
      # pipefail` explicito no bloco: nao confia no padrao do executor,
      # escreve a garantia (mesmo espirito do WITH CHECK explicito do §9).
      - name: Baixar e conferir gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod +x gitleaks

      # `--redact`: se achar um segredo de verdade, o valor nunca aparece em
      # texto puro no log da esteira — so arquivo, linha e commit. O log e
      # mais duradouro e mais visivel que o proprio repositorio; imprimir o
      # segredo ali trocaria um vazamento por outro.
      #
      # `-v` (verbose) e OBRIGATORIO pro `--redact` valer alguma coisa:
      # achado na primeira execucao real desta esteira (PR de teste da
      # tarefa 4) — sem `-v`, o log so mostra "leaks found: N", sem
      # arquivo nem linha, e quem visse o alarme nao teria por onde
      # comecar a investigar.
      #
      # Varre o historico git INTEIRO a cada execucao, nao so o commit
      # atual — medido (plano da tarefa 4): 80 commits, ~3,9 MB, 0,75 a
      # 1,03s. Reavaliar so quando este passo especifico ficar lento de
      # verdade, nao por numero de commits escolhido de antemao.
      #
      # `-c .gitleaks.toml` EXPLICITO, e a checagem `test -f` antes: sem os
      # dois, um `.gitleaks.toml` movido, renomeado ou apagado por engano
      # faria o gitleaks cair sozinho na configuracao padrao (que nao pega
      # URL de conexao com senha embutida — a razao desta tarefa existir) e
      # a esteira passaria verde SEM a regra propria, sem ninguem notar. A
      # config nao lida sozinha, a checagem falha o passo primeiro.
      - name: Varredura de segredo
        run: |
          set -euo pipefail
          test -f .gitleaks.toml
          ./gitleaks detect --source . --config .gitleaks.toml --redact -v

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `prisma.config.ts` chama process.loadEnvFile() no topo do módulo para
      # qualquer subcomando do Prisma disparado manualmente — os passos
      # abaixo (`guarda-de-banco.ts`, `npx prisma generate`) incluídos. Sem
      # o arquivo, eles quebram com ENOENT, e é por isso que este passo tem
      # que vir antes deles.
      #
      # Exceção, desde que `package.json` ganhou `postinstall: prisma
      # generate`: o `npm ci` logo acima já dispara esse script sozinho,
      # antes deste `.env` existir. `prisma.config.ts` reconhece esse caso
      # pelo `npm_lifecycle_event` (só vale "postinstall" quando é o próprio
      # npm chamando) e pula o carregamento — por isso o `npm ci` não quebra
      # aqui, mesmo sem arquivo nenhum. `generate` não precisa de conexão
      # real, só do schema.
      #
      # Delimitador do heredoc ENTRE ASPAS (`<<'EOF'`, não `<<EOF`) de
      # propósito: sem isso, se alguma senha tivesse `$` ou crase, o shell
      # tentaria interpretar em vez de gravar o valor literal. Caractere
      # especial em senha já custou três rodadas neste projeto — ver
      # `docs/diario.md`, 08/08/2026.
      #
      # RESEND_API_KEY, EMAIL_REMETENTE, EMAIL_RESPOSTA, NEXT_PUBLIC_APP_URL,
      # SUPABASE_URL e KIWIFY_WEBHOOK_TOKEN são valor FIXO, não secret — de
      # propósito. `src/lib/auth/index.ts`, `src/lib/email/index.ts`,
      # `src/lib/servicos/comprovantes.ts` e `src/app/api/webhooks/kiwify/
      # route.ts` (item 13, Tarefa 1) lançam erro no carregamento se
      # qualquer uma faltar, mas nenhum teste desta suíte manda e-mail de
      # verdade, assina sessão de cliente real, nem dispara a rota de
      # webhook contra um endpoint da Kiwify de verdade — só precisam
      # existir para o módulo carregar. Colocar chave de verdade do Resend
      # aqui mandaria e-mail a cada execução da esteira, sem necessidade.
      # EMAIL_REMETENTE/EMAIL_RESPOSTA em endereços diferentes de propósito
      # — mesmo padrão do valor real (subdomínio de envio / domínio raiz,
      # `docs/especificacao.md`), só que com valor fake. SUPABASE_URL é só o
      # endereço da API do projeto de TESTE (`qutzsvrkaqvpluqxbhmp`,
      # `CLAUDE.md` §5) — o projeto já é público no sentido de que
      # `DATABASE_URL` (secret) já entrega o mesmo identificador no host do
      # pooler; não há segredo extra aqui. KIWIFY_WEBHOOK_TOKEN é um valor
      # que ninguém, além desta esteira, precisa reconhecer — nenhuma conta
      # Kiwify real existe apontando para cá.
      #
      # BETTER_AUTH_SECRET e SUPABASE_SERVICE_ROLE_KEY SÃO SECRET DO GITHUB,
      # não valor fixo como os seis acima — mas por motivos diferentes entre
      # si. BETTER_AUTH_SECRET não protege sessão real (`docs/diario.md`,
      # 08/08/2026): um valor com FORMA de segredo, versionado, aciona
      # scanner de segredo (inclusive o do próprio GitHub) e ensina a ignorar
      # alerta — as demais variáveis fixas não têm essa forma, por isso ficam
      # fixas. SUPABASE_SERVICE_ROLE_KEY protege acesso de verdade: essa
      # chave ignora RLS por atributo — quem a tiver lê/grava qualquer balde
      # do projeto de teste (item 5, Tarefa 4).
      - name: Criar .env de teste
        run: |
          cat <<'EOF' > .env
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_DATABASE_URL=${{ secrets.AUTH_DATABASE_URL }}
          RESEND_API_KEY=ci-nao-e-segredo-nenhum-teste-manda-email
          EMAIL_REMETENTE=ci@envio.fretigate.com
          EMAIL_RESPOSTA=ci@fretigate.com
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET_CI }}
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          KIWIFY_WEBHOOK_TOKEN=ci-nao-e-segredo-nenhuma-conta-kiwify-aponta-pra-ca
          SUPABASE_URL=https://qutzsvrkaqvpluqxbhmp.supabase.co
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY_CI }}
          EOF

      # A mesma trava que protege `npm test` (tests/guarda-de-banco.ts), rodada
      # como script avulso — ela já valida `process.env` na própria importação.
      # Sem isto, só `npm test` era protegido: um secret do GitHub apontado
      # para um projeto desconhecido faria os passos abaixo (generate, o
      # reset e o seed) rodar contra um banco que não é nem de
      # desenvolvimento nem de teste, sem ninguém avisar.
      - run: node --env-file=.env tests/guarda-de-banco.ts

      - run: npx prisma generate

      # A trava de ESLint (SQL cru só em src/lib/db e em /tests, CLAUDE.md
      # §3). Roda antes de qualquer passo com credencial de banco: se falhar,
      # a esteira para aqui.
      - run: npm run lint

      # Derruba o schema do projeto de teste e reaplica as migrations, TODAS,
      # em sequência, do zero — não só o que ainda faltava.
      #
      # POR QUE, E NÃO `migrate deploy` (decisão do fundador, 11/08/2026)
      # `migrate deploy` só aplica migration nova sobre o que já existia —
      # nunca prova que a sequência inteira funciona partindo do nada, que é
      # exatamente como a produção vai nascer no dia em que existir. Ninguém
      # nunca tinha subido este banco do zero até a tarefa 1 do item 3
      # (11/08/2026), e foi só fazendo isso que apareceram dois problemas
      # reais: uma migration com checksum divergente do que está commitado
      # (histórico, sem efeito de schema), e uma migration que achava que
      # fechava função nova para a API pública e nunca fechou nada — os dois
      # ficaram invisíveis rodando só `migrate deploy` incremental.
      #
      # O projeto de teste é o lugar certo pra isso: não tem dado real de
      # cliente, é semeado e apagado pelos próprios testes a cada execução
      # (CLAUDE.md §5). O custo é a esteira ficar mais lenta — reconstrói o
      # banco inteiro a cada execução, em vez de só aplicar o que faltava.
      #
      # Trava PRÓPRIA antes deste passo, mais rígida que a de cima
      # (tests/guarda-do-reset.ts): `migrate deploy` incremental num secret
      # apontado para desenvolvimento por engano era inofensivo (reaplicava
      # migration já aplicada). `migrate reset --force` não é — derruba o
      # schema inteiro. A trava geral aprova desenvolvimento OU teste; esta
      # aprova só teste.
      - run: node --env-file=.env tests/guarda-do-reset.ts

      # `cancel-in-progress` (acima) cancela a execução anterior, mas só
      # manda sinal para o processo de topo do passo — um processo filho
      # (o `node`/`npx` que fala com o Postgres) não recebe nada, e pode
      # continuar conectado ao Supabase por até dez segundos depois do
      # cancelamento, segurando lock em cima do que `migrate reset --force`
      # precisa derrubar (pesquisado no comportamento documentado do runner
      # do GitHub Actions, não medido diretamente forçando um cancelamento).
      # Este passo mata as conexões dos papéis do produto (CLAUDE.md §9) no
      # projeto de teste antes do reset — o resultado (o sinal chega, a
      # conexão morre) é conferido pelo próprio script, não só suposto
      # (`tests/encerra-conexoes-anteriores.ts`). O privilégio de
      # `pg_terminate_backend` foi medido contra o papel `postgres`, mas
      # contra o banco de DESENVOLVIMENTO — a prova de que o passo roda
      # certo contra o projeto de TESTE de verdade é o push de verificação
      # desta tarefa, não este comentário.
      - run: node --env-file=.env tests/encerra-conexoes-anteriores.ts
      - run: npx prisma migrate reset --force

      # Os 5.570 municípios do IBGE. Passo PRÓPRIO, nunca `postinstall`
      # (docs/especificacao.md §6): `npm install` roda a cada publicação na
      # Vercel, e um `postinstall` tentaria falar com o banco durante o build.
      #
      # Vem DEPOIS do migrate (a tabela precisa existir) e ANTES dos testes
      # (tests/municipios.test.ts confere a carga). Idempotente: só grava o que
      # está faltando ou mudou, então repetir execução da esteira não duplica
      # nem reescreve nada.
      - run: npm run seed:municipios

      # tests/guarda-de-banco.ts (setupFiles) confere sozinho que está
      # rodando contra o projeto de teste certo antes de qualquer teste
      # conectar.
      - run: npm test
